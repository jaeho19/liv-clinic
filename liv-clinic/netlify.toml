[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_SITE_URL = "https://liv-clinic.net"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ──────────────────────────────────────────
# Custom domain redirects
# ──────────────────────────────────────────

# www -> non-www canonical redirect
[[redirects]]
  from = "https://www.liv-clinic.net/*"
  to = "https://liv-clinic.net/:splat"
  status = 301
  force = true

# Root -> /ko (default locale)
[[redirects]]
  from = "/"
  to = "/ko"
  status = 302

# ──────────────────────────────────────────
# Old WordPress URLs
# ──────────────────────────────────────────
# ⚠️ 실행 순서: Netlify에서는 Next 미들웨어(엣지 함수)가 이 [[redirects]]보다 먼저 돈다.
# 점(.)이 없는 경로(/staff, /notice, /feed …)는 미들웨어가 먼저 잡으므로 여기 규칙은 절대
# 발동하지 않는다(2026-09-06 실측: /staff → 307 /ko/staff). 레거시 매핑·410은 전부
# src/lib/legacyRedirects.ts + src/middleware.ts 에 있다. 여기에는 미들웨어 matcher가
# 건너뛰는 점(.) 경로에 대한 예비 규칙만 남긴다. (wp-*.php, xmlrpc.php는 미들웨어 410)

# 옛 워드프레스 진입점 — 미들웨어 matcher에도 /index.php를 넣어 엣지에서 301 하지만(500 방지),
# 엣지 함수가 빠지는 경우를 대비해 Netlify 규칙도 유지한다 (2026-09-05 실측 500, 2026-09-06 이중화)
[[redirects]]
  from = "/index.php"
  to = "/ko"
  status = 301

# ──────────────────────────────────────────
# Security & performance headers
# ──────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
