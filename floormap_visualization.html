<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIV Floormap - Block Detection Visualization</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 24px;
  }
  h1 {
    text-align: center;
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #f0f0f0;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #888;
    margin-bottom: 24px;
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    border: 2px solid transparent;
    user-select: none;
  }
  .legend-item:hover { transform: translateY(-1px); }
  .legend-item.active { border-color: #fff; }
  .legend-item.dimmed { opacity: 0.3; }
  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.3);
  }
  .legend-blue { background: rgba(100,160,230,0.15); }
  .legend-blue .legend-swatch { background: #5b9bd5; }
  .legend-beige { background: rgba(210,190,160,0.15); }
  .legend-beige .legend-swatch { background: #d4c4a8; }
  .legend-gray { background: rgba(160,160,170,0.15); }
  .legend-gray .legend-swatch { background: #a0a0aa; }
  .legend-red { background: rgba(220,100,100,0.15); }
  .legend-red .legend-swatch { background: #dc6464; }
  .legend-green { background: rgba(100,200,150,0.15); }
  .legend-green .legend-swatch { background: #64c896; }

  .svg-wrap {
    background: #16213e;
    border-radius: 12px;
    padding: 16px;
    overflow: auto;
    border: 1px solid #2a2a4a;
    position: relative;
  }
  svg { display: block; margin: 0 auto; }

  .tooltip {
    position: fixed;
    background: #0f0f23;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    min-width: 180px;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip-row { display: flex; justify-content: space-between; gap: 16px; margin: 2px 0; }
  .tooltip-label { color: #888; }
  .tooltip-value { color: #fff; font-weight: 500; font-variant-numeric: tabular-nums; }

  .info-panel {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    margin-top: 20px;
  }
  .info-card {
    background: #16213e;
    border: 1px solid #2a2a4a;
    border-radius: 10px;
    padding: 16px;
  }
  .info-card h3 {
    font-size: 13px;
    color: #888;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .info-card .value {
    font-size: 28px;
    font-weight: 700;
    color: #f0f0f0;
  }
  .info-card .detail {
    font-size: 12px;
    color: #666;
    margin-top: 4px;
  }

  .region-divider {
    stroke: rgba(255,255,255,0.08);
    stroke-width: 1;
    stroke-dasharray: 8 4;
  }
  .region-label {
    fill: rgba(255,255,255,0.15);
    font-size: 14px;
    font-weight: 600;
    text-anchor: middle;
  }
</style>
</head>
<body>

<div class="container">
  <h1>LIV Floormap Block Detection</h1>
  <p class="subtitle">HSV Color Segmentation + Connected Components (8-connectivity) &middot; noise &lt; 500px filtered</p>

  <div class="controls" id="legend"></div>

  <div class="svg-wrap">
    <svg id="floormap" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="info-panel" id="infoPanel"></div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const DATA = [
  {id:1,color:"blue",x_min:491,y_min:47,x_max:702,y_max:353,width:211,height:306,cx:596,cy:199,region:"center-left"},
  {id:2,color:"blue",x_min:715,y_min:47,x_max:926,y_max:353,width:211,height:306,cx:819,cy:199,region:"center-left"},
  {id:3,color:"blue",x_min:85,y_min:48,x_max:374,y_max:188,width:289,height:140,cx:229,cy:117,region:"left column"},
  {id:4,color:"blue",x_min:80,y_min:217,x_max:371,y_max:358,width:291,height:141,cx:225,cy:286,region:"left column"},
  {id:5,color:"blue",x_min:81,y_min:387,x_max:371,y_max:529,width:290,height:142,cx:225,cy:457,region:"left column"},
  {id:6,color:"blue",x_min:80,y_min:549,x_max:371,y_max:691,width:291,height:142,cx:225,cy:619,region:"left column"},
  {id:7,color:"blue",x_min:84,y_min:713,x_max:374,y_max:854,width:290,height:141,cx:228,cy:782,region:"left column"},
  {id:8,color:"blue",x_min:84,y_min:879,x_max:374,y_max:1020,width:290,height:141,cx:228,cy:949,region:"left column"},
  {id:9,color:"blue",x_min:84,y_min:1048,x_max:483,y_max:1300,width:399,height:252,cx:283,cy:1173,region:"left column"},
  {id:10,color:"beige",x_min:938,y_min:45,x_max:1171,y_max:290,width:233,height:245,cx:1054,cy:166,region:"center-right"},
  {id:11,color:"beige",x_min:1182,y_min:45,x_max:1416,y_max:354,width:234,height:309,cx:1298,cy:199,region:"center-right"},
  {id:12,color:"beige",x_min:1535,y_min:47,x_max:1694,y_max:178,width:159,height:131,cx:1606,cy:101,region:"right column"},
  {id:13,color:"beige",x_min:1427,y_min:50,x_max:1545,y_max:130,width:118,height:80,cx:1479,cy:88,region:"center-right"},
  {id:16,color:"beige",x_min:1658,y_min:173,x_max:1716,y_max:262,width:58,height:89,cx:1694,cy:209,region:"right column"},
  {id:17,color:"beige",x_min:1724,y_min:184,x_max:1930,y_max:430,width:206,height:246,cx:1826,cy:307,region:"right column"},
  {id:22,color:"beige",x_min:1619,y_min:480,x_max:1935,y_max:740,width:316,height:260,cx:1776,cy:608,region:"right column"},
  {id:23,color:"beige",x_min:628,y_min:501,x_max:988,y_max:885,width:360,height:384,cx:798,cy:695,region:"center-left"},
  {id:24,color:"beige",x_min:1010,y_min:510,x_max:1219,y_max:813,width:209,height:303,cx:1114,cy:667,region:"center-right"},
  {id:27,color:"beige",x_min:1234,y_min:523,x_max:1443,y_max:814,width:209,height:291,cx:1329,cy:702,region:"center-right"},
  {id:28,color:"beige",x_min:1006,y_min:837,x_max:1220,y_max:1021,width:214,height:184,cx:1113,cy:928,region:"center-right"},
  {id:29,color:"beige",x_min:1053,y_min:837,x_max:1438,y_max:1193,width:385,height:356,cx:1283,cy:1040,region:"center-right"},
  {id:30,color:"beige",x_min:637,y_min:901,x_max:929,y_max:1095,width:292,height:194,cx:782,cy:997,region:"center-left"},
  {id:31,color:"beige",x_min:1665,y_min:1141,x_max:1890,y_max:1148,width:225,height:7,cx:1774,cy:1142,region:"right column"},
  {id:32,color:"beige",x_min:80,y_min:1310,x_max:485,y_max:1643,width:405,height:333,cx:282,cy:1477,region:"left column"},
  {id:33,color:"gray",x_min:1422,y_min:47,x_max:1715,y_max:352,width:293,height:305,cx:1567,cy:199,region:"right column"},
  {id:34,color:"gray",x_min:627,y_min:500,x_max:988,y_max:880,width:361,height:380,cx:806,cy:689,region:"center-left"},
  {id:35,color:"gray",x_min:1010,y_min:510,x_max:1220,y_max:814,width:210,height:304,cx:1114,cy:661,region:"center-right"},
  {id:36,color:"gray",x_min:1233,y_min:510,x_max:1445,y_max:814,width:212,height:304,cx:1338,cy:661,region:"center-right"},
  {id:37,color:"red",x_min:1631,y_min:945,x_max:1931,y_max:1137,width:300,height:192,cx:1788,cy:1033,region:"right column"},
  {id:39,color:"red",x_min:656,y_min:1123,x_max:923,y_max:1339,width:267,height:216,cx:783,cy:1226,region:"center-left"},
  {id:41,color:"red",x_min:1637,y_min:1162,x_max:1933,y_max:1354,width:296,height:192,cx:1794,cy:1252,region:"right column"},
  {id:44,color:"green",x_min:1637,y_min:811,x_max:1939,y_max:928,width:302,height:117,cx:1787,cy:869,region:"right column"},
];

const ROOM_MAP = {
  blue: { label: "관리실 (Recovery)", fill: "#5b9bd5", stroke: "#4a86be" },
  beige: { label: "오피스/기타 (Office)", fill: "#d4c4a8", stroke: "#bfac8e" },
  gray: { label: "시술실 (Procedure)", fill: "#a0a0aa", stroke: "#8a8a94" },
  red: { label: "상담실 (Consultation)", fill: "#dc6464", stroke: "#c44e4e" },
  green: { label: "포토실 (Photo)", fill: "#64c896", stroke: "#4eb07e" },
};

// dimensions
const PAD = 40;
const IMG_W = 2000;
const IMG_H = 1700;
const SCALE = 0.55;
const SVG_W = IMG_W * SCALE + PAD * 2;
const SVG_H = IMG_H * SCALE + PAD * 2;
const REGION_BOUNDS = [0.25, 0.5, 0.75];

// active color filter
let activeColor = null;

// tooltip
const tooltipEl = document.getElementById("tooltip");

function buildLegend() {
  const legend = document.getElementById("legend");
  const colors = ["blue", "beige", "gray", "red", "green"];
  colors.forEach(c => {
    const count = DATA.filter(d => d.color === c).length;
    const item = document.createElement("div");
    item.className = `legend-item legend-${c} active`;
    item.dataset.color = c;
    item.innerHTML = `<span class="legend-swatch"></span>${ROOM_MAP[c].label} (${count})`;
    item.addEventListener("click", () => toggleColor(c));
    legend.appendChild(item);
  });
}

function toggleColor(color) {
  if (activeColor === color) {
    activeColor = null;
  } else {
    activeColor = color;
  }
  updateVisibility();
}

function updateVisibility() {
  document.querySelectorAll(".legend-item").forEach(el => {
    if (activeColor === null) {
      el.classList.add("active");
      el.classList.remove("dimmed");
    } else {
      el.classList.toggle("active", el.dataset.color === activeColor);
      el.classList.toggle("dimmed", el.dataset.color !== activeColor);
    }
  });
  document.querySelectorAll(".block-group").forEach(el => {
    const c = el.dataset.color;
    if (activeColor === null) {
      el.style.opacity = "1";
    } else {
      el.style.opacity = c === activeColor ? "1" : "0.08";
    }
  });
}

function buildSVG() {
  const svg = document.getElementById("floormap");
  svg.setAttribute("width", SVG_W);
  svg.setAttribute("height", SVG_H);
  svg.setAttribute("viewBox", `0 0 ${SVG_W} ${SVG_H}`);

  // background
  const bg = rect(0, 0, SVG_W, SVG_H, "#0d1117", "none", 0);
  bg.setAttribute("rx", "8");
  svg.appendChild(bg);

  // region dividers
  REGION_BOUNDS.forEach((r, i) => {
    const x = PAD + r * IMG_W * SCALE;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", x); line.setAttribute("y1", PAD - 20);
    line.setAttribute("x2", x); line.setAttribute("y2", SVG_H - PAD + 10);
    line.setAttribute("class", "region-divider");
    svg.appendChild(line);
  });

  // region labels
  const regions = [
    { label: "LEFT", cx: 0.125 },
    { label: "CENTER-LEFT", cx: 0.375 },
    { label: "CENTER-RIGHT", cx: 0.625 },
    { label: "RIGHT", cx: 0.875 },
  ];
  regions.forEach(r => {
    const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    txt.setAttribute("x", PAD + r.cx * IMG_W * SCALE);
    txt.setAttribute("y", PAD - 8);
    txt.setAttribute("class", "region-label");
    txt.textContent = r.label;
    svg.appendChild(txt);
  });

  // draw blocks (sorted so smaller on top)
  const sorted = [...DATA].sort((a, b) => (b.width * b.height) - (a.width * a.height));

  sorted.forEach(d => {
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "block-group");
    g.dataset.color = d.color;
    g.style.transition = "opacity 0.3s";

    const x = PAD + d.x_min * SCALE;
    const y = PAD + d.y_min * SCALE;
    const w = d.width * SCALE;
    const h = d.height * SCALE;
    const info = ROOM_MAP[d.color];

    // shadow
    const shadow = rect(x + 2, y + 2, w, h, "rgba(0,0,0,0.3)", "none", 0);
    shadow.setAttribute("rx", "4");
    shadow.setAttribute("filter", "url(#blur)");
    g.appendChild(shadow);

    // main rect
    const main = rect(x, y, w, h, info.fill + "40", info.stroke, 1.5);
    main.setAttribute("rx", "4");
    main.style.cursor = "pointer";
    g.appendChild(main);

    // id label
    if (w > 30 && h > 20) {
      const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
      txt.setAttribute("x", x + w / 2);
      txt.setAttribute("y", y + h / 2 + 4);
      txt.setAttribute("text-anchor", "middle");
      txt.setAttribute("fill", info.fill);
      txt.setAttribute("font-size", Math.min(14, w / 3, h / 2));
      txt.setAttribute("font-weight", "600");
      txt.setAttribute("pointer-events", "none");
      txt.textContent = `#${d.id}`;
      g.appendChild(txt);
    }

    // center dot
    const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    dot.setAttribute("cx", PAD + d.cx * SCALE);
    dot.setAttribute("cy", PAD + d.cy * SCALE);
    dot.setAttribute("r", "3");
    dot.setAttribute("fill", info.fill);
    dot.setAttribute("opacity", "0.7");
    dot.setAttribute("pointer-events", "none");
    g.appendChild(dot);

    // events
    g.addEventListener("mouseenter", e => showTooltip(e, d));
    g.addEventListener("mousemove", e => moveTooltip(e));
    g.addEventListener("mouseleave", hideTooltip);

    svg.appendChild(g);
  });

  // filter for shadow
  const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
  defs.innerHTML = '<filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>';
  svg.prepend(defs);
}

function rect(x, y, w, h, fill, stroke, sw) {
  const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  r.setAttribute("x", x); r.setAttribute("y", y);
  r.setAttribute("width", w); r.setAttribute("height", h);
  r.setAttribute("fill", fill);
  if (stroke !== "none") { r.setAttribute("stroke", stroke); r.setAttribute("stroke-width", sw); }
  return r;
}

function showTooltip(e, d) {
  const info = ROOM_MAP[d.color];
  tooltipEl.innerHTML = `
    <div style="font-weight:700;margin-bottom:6px;color:${info.fill}">Block #${d.id} &mdash; ${info.label}</div>
    <div class="tooltip-row"><span class="tooltip-label">Region</span><span class="tooltip-value">${d.region}</span></div>
    <div class="tooltip-row"><span class="tooltip-label">Position</span><span class="tooltip-value">(${d.x_min}, ${d.y_min}) → (${d.x_max}, ${d.y_max})</span></div>
    <div class="tooltip-row"><span class="tooltip-label">Size</span><span class="tooltip-value">${d.width} × ${d.height} px</span></div>
    <div class="tooltip-row"><span class="tooltip-label">Area</span><span class="tooltip-value">${(d.width * d.height).toLocaleString()} px²</span></div>
    <div class="tooltip-row"><span class="tooltip-label">Center</span><span class="tooltip-value">(${d.cx}, ${d.cy})</span></div>
  `;
  tooltipEl.classList.add("visible");
  moveTooltip(e);
}

function moveTooltip(e) {
  const pad = 12;
  let x = e.clientX + pad;
  let y = e.clientY + pad;
  const rect = tooltipEl.getBoundingClientRect();
  if (x + rect.width > window.innerWidth - pad) x = e.clientX - rect.width - pad;
  if (y + rect.height > window.innerHeight - pad) y = e.clientY - rect.height - pad;
  tooltipEl.style.left = x + "px";
  tooltipEl.style.top = y + "px";
}

function hideTooltip() {
  tooltipEl.classList.remove("visible");
}

function buildInfoPanel() {
  const panel = document.getElementById("infoPanel");

  const totalBlocks = DATA.length;
  const colorCounts = {};
  const regionCounts = {};
  let totalArea = 0;
  DATA.forEach(d => {
    colorCounts[d.color] = (colorCounts[d.color] || 0) + 1;
    regionCounts[d.region] = (regionCounts[d.region] || 0) + 1;
    totalArea += d.width * d.height;
  });

  const cards = [
    { title: "Total Blocks", value: totalBlocks, detail: "After noise filtering (≥500px)" },
    { title: "Total Area", value: (totalArea / 1e6).toFixed(2) + "M", detail: `${totalArea.toLocaleString()} px²` },
    { title: "Color Types", value: Object.keys(colorCounts).length, detail: Object.entries(colorCounts).map(([k,v]) => `${k}: ${v}`).join(", ") },
    { title: "Regions", value: Object.keys(regionCounts).length, detail: Object.entries(regionCounts).map(([k,v]) => `${k}: ${v}`).join(", ") },
  ];

  cards.forEach(c => {
    const card = document.createElement("div");
    card.className = "info-card";
    card.innerHTML = `<h3>${c.title}</h3><div class="value">${c.value}</div><div class="detail">${c.detail}</div>`;
    panel.appendChild(card);
  });
}

// init
buildLegend();
buildSVG();
buildInfoPanel();
</script>
</body>
</html>
